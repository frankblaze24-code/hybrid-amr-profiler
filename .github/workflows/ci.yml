name: AMR Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.3.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          R -e "install.packages(c('readr', 'dplyr', 'ggplot2'), repos='https://cloud.r-project.org/')"

      - name: Run Resistome Visualization Script
        run: |
          Rscript scripts/plot_resistome.R
